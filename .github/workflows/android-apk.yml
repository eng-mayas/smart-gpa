# Builds an installable Android APK (no Google Play needed) on every push to main
# and on manual trigger. Download it from the workflow run → Artifacts → smart-gpa-apk.
#
# Signing (recommended, so updates install over the old version):
#   1) Generate a keystore once (see scripts/make-keystore.sh)
#   2) Add repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without secrets the workflow still produces a debug-signed APK that installs fine.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - uses: android-actions/setup-android@v3

      - name: Install dependencies & build web app
        run: |
          npm install
          npm install @capacitor/core @capacitor/android @capacitor/splash-screen @capacitor/status-bar
          npm install -D @capacitor/cli
          npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Decode keystore (if provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password='${{ secrets.KEYSTORE_PASSWORD }}' \
            -Pandroid.injected.signing.key.alias='${{ secrets.KEY_ALIAS }}' \
            -Pandroid.injected.signing.key.password='${{ secrets.KEY_PASSWORD }}'
          cp app/build/outputs/apk/release/app-release.apk ../SmartGPA.apk

      - name: Build debug APK (no keystore configured)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../SmartGPA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: smart-gpa-apk
          path: SmartGPA.apk
